# Release the single-file `aivin` binaries + installers to GitHub Releases on every version tag (v1.2.3).
#
# Users install with (Aivin prints these with a pairing code in chat box -> Browser menu -> Add this computer):
#   Windows:      irm https://get.aivin.vn/install.ps1 | iex
#   macOS/Linux:  curl -fsSL https://get.aivin.vn/install.sh | sh
#
# get.aivin.vn (deploy/get, `npm run get:publish` on the host behind Cloudflare) is the primary download site. This
# GitHub Release is the mirror: installers accept AIVIN_DOWNLOAD_BASE=https://github.com/aivin-labs/cli/releases/latest/download.
#
# These CI builds (clean `npm ci` from the lockfile) are also what gets signed for self-update - the release signing key never
# enters CI: on the signing machine, `npm run release:fetch -- <tag>` pulls them into dist/, then `npm run sign:release` and
# `npm run get:publish`. This GitHub Release carries no SHA256SUMS.sig, so installed CLIs never self-update from it.
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to (re)build, e.g. v1.1.0'
        required: true

permissions:
  contents: write

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  # Self-update swaps the running binary differently per OS (Windows renames the locked .exe, macOS/Linux rename atomically) and the
  # supervisor scripts differ (VBS vs sh) - run the suite on all three, not only Linux.
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Tag must match package.json version
        shell: bash
        run: |
          PKG="v$(node -p "require('./package.json').version")"
          [ "$PKG" = "$TAG" ] || { echo "Tag $TAG does not match package.json $PKG"; exit 1; }
      - run: npm test

  # Builds run in parallel with the test matrix (they don't need its output) - only `release` waits for both, so a failing test
  # still publishes nothing. Saves the ~1 min the builds used to queue behind the slowest (Windows) test job.
  build-linux-windows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Bun (devDependency) cross-compiles every target from one runner.
      - run: npx bun scripts/build-binary.mjs windows-x64 windows-arm64 linux-x64 linux-arm64 linux-x64-musl linux-arm64-musl
      - name: Smoke test
        run: ./dist/aivin-linux-x64 --version
      - uses: actions/upload-artifact@v4
        with:
          name: bin-linux-windows
          path: dist/*.gz

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx bun scripts/build-binary.mjs darwin-x64 darwin-arm64
      # Apple Silicon refuses to run unsigned binaries - ad-hoc sign at minimum. A Developer ID signature +
      # notarization (needs an Apple Developer account) is still required to avoid Gatekeeper prompts for
      # files downloaded by a browser; `curl | sh` downloads are not quarantined, so the installer works as is.
      - name: Ad-hoc codesign
        run: |
          for f in dist/aivin-darwin-x64 dist/aivin-darwin-arm64; do codesign --force --sign - "$f"; gzip -9 -c "$f" > "$f.gz"; done
      - name: Smoke test
        run: ./dist/aivin-darwin-arm64 --version
      - uses: actions/upload-artifact@v4
        with:
          name: bin-macos
          path: dist/*.gz

  release:
    needs: [test, build-linux-windows, build-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Collect assets + checksums
        run: |
          mkdir -p release
          cp artifacts/* release/
          cp scripts/install.ps1 scripts/install.sh release/
          # Checksums over the final (signed) files - computed here, after every build job finished.
          (cd release && sha256sum aivin-*.gz > SHA256SUMS && cat SHA256SUMS)
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release/* --clobber
          else
            gh release create "$TAG" release/* --title "$TAG" --generate-notes
          fi

  # npm via trusted publishing (OIDC): no token, no OTP - npmjs.com trusts this repo + workflow file (package settings -> Trusted
  # publishing: aivin-labs/cli, release.yml, "npm publish" allowed). Runs only after `release` (tests on 3 OS + builds green), so npm never
  # gets a version the feed would not. continue-on-error keeps the run green while the trusted publisher is not configured yet:
  # release-publish.mjs reads this job's result and falls back to an interactive `npm publish` (OTP) on the signing machine.
  # The release signing key (get.aivin.vn feed) still never enters CI.
  npm-publish:
    needs: [release]
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      # No `registry-url`: it writes an .npmrc that reads NODE_AUTH_TOKEN, which overrides the OIDC exchange.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # Trusted publishing needs npm >= 11.5.1.
      - run: npm install -g npm@^11.5.1
      - name: Publish to npm (skip when this version is already there)
        shell: bash
        run: |
          NAME="$(node -p "require('./package.json').name")"
          VER="$(node -p "require('./package.json').version")"
          [ "v$VER" = "$TAG" ] || { echo "Tag $TAG does not match package.json v$VER"; exit 1; }
          if [ "$(npm view "$NAME@$VER" version 2>/dev/null)" = "$VER" ]; then echo "$NAME@$VER is already on npm - skip."; exit 0; fi
          npm publish --access public
