<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Aivin Remote architecture</title>
  <desc id="desc">Aivin Platform sends authenticated work over outbound encrypted connections to Aivin listeners on multiple computers. Each listener applies local policy, requests approval when required, controls local tools and returns status and results. The mascot is a local interface to its listener.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7f9ff"/>
      <stop offset="1" stop-color="#eef8ff"/>
    </linearGradient>
    <linearGradient id="platform" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5b5ce2"/>
      <stop offset="1" stop-color="#1677ff"/>
    </linearGradient>
    <linearGradient id="device" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f4f8ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#183b73" flood-opacity=".14"/>
    </filter>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10Z" fill="#5b6ee1"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10Z" fill="#00a870"/>
    </marker>
    <style>
      .title{font:700 28px 'Segoe UI',Arial,sans-serif;fill:#17233d}.subtitle{font:400 15px 'Segoe UI',Arial,sans-serif;fill:#60708f}
      .boxTitle{font:700 19px 'Segoe UI',Arial,sans-serif;fill:#17233d}.boxText{font:400 14px 'Segoe UI',Arial,sans-serif;fill:#52627e}
      .whiteTitle{font:700 22px 'Segoe UI',Arial,sans-serif;fill:#fff}.whiteText{font:400 14px 'Segoe UI',Arial,sans-serif;fill:#e9f3ff}
      .pill{font:600 12px 'Segoe UI',Arial,sans-serif}.flow{font:600 13px 'Segoe UI',Arial,sans-serif;fill:#405275}
      .step{font:700 13px 'Segoe UI',Arial,sans-serif;fill:#fff}.small{font:400 12px 'Segoe UI',Arial,sans-serif;fill:#65738c}
    </style>
  </defs>

  <rect width="1200" height="720" rx="28" fill="url(#bg)"/>
  <text x="54" y="54" class="title">How Aivin Remote connects the platform to your computers</text>
  <text x="54" y="82" class="subtitle">Every device initiates its own encrypted connection; Aivin does not expose an inbound remote-control port.</text>

  <g filter="url(#shadow)">
    <rect x="405" y="116" width="390" height="150" rx="24" fill="url(#platform)"/>
  </g>
  <circle cx="457" cy="164" r="24" fill="#ffffff" fill-opacity=".18"/>
  <path d="M444 165c10-18 23-18 31-4-11-4-19 2-26 14 1-6-1-9-5-10Z" fill="#fff"/>
  <text x="493" y="158" class="whiteTitle">Aivin Platform</text>
  <text x="493" y="184" class="whiteText">Chats · agents · missions · approvals</text>
  <rect x="443" y="211" width="145" height="28" rx="14" fill="#fff" fill-opacity=".16"/>
  <text x="515" y="230" text-anchor="middle" class="pill" fill="#fff">authenticated routing</text>
  <rect x="600" y="211" width="155" height="28" rx="14" fill="#fff" fill-opacity=".16"/>
  <text x="677" y="230" text-anchor="middle" class="pill" fill="#fff">status + result relay</text>

  <path d="M465 286C392 325 300 327 236 368" fill="none" stroke="#5b6ee1" stroke-width="3" marker-end="url(#arrowBlue)"/>
  <path d="M735 286C808 325 900 327 964 368" fill="none" stroke="#5b6ee1" stroke-width="3" marker-end="url(#arrowBlue)"/>
  <path d="M600 286V368" fill="none" stroke="#5b6ee1" stroke-width="3" marker-end="url(#arrowBlue)"/>
  <text x="600" y="314" text-anchor="middle" class="flow">work ↓</text>
  <text x="600" y="345" text-anchor="middle" class="small">TLS / Socket.IO · outbound from each computer</text>

  <g transform="translate(54 374)" filter="url(#shadow)">
    <rect width="330" height="250" rx="22" fill="url(#device)" stroke="#dce6f7"/>
    <circle cx="38" cy="40" r="20" fill="#e8edff"/><text x="38" y="45" text-anchor="middle" class="pill" fill="#5b5ce2">1</text>
    <text x="70" y="38" class="boxTitle">Work computer</text><text x="70" y="61" class="boxText">Windows · macOS · Linux</text>
    <rect x="24" y="84" width="282" height="50" rx="12" fill="#eef1ff"/>
    <text x="40" y="106" class="pill" fill="#4b56c0">Aivin listener</text><text x="40" y="124" class="small">identity · policy · scheduler</text>
    <rect x="24" y="146" width="134" height="38" rx="10" fill="#e8fff6"/><text x="91" y="170" text-anchor="middle" class="pill" fill="#00875a">Local approval</text>
    <rect x="172" y="146" width="134" height="38" rx="10" fill="#edf7ff"/><text x="239" y="170" text-anchor="middle" class="pill" fill="#1668b2">Tools &amp; apps</text>
    <rect x="24" y="198" width="282" height="28" rx="14" fill="#f2f4f8"/><text x="165" y="217" text-anchor="middle" class="small">files · browser · GUI · shell · Office</text>
  </g>

  <g transform="translate(435 374)" filter="url(#shadow)">
    <rect width="330" height="250" rx="22" fill="url(#device)" stroke="#dce6f7"/>
    <circle cx="38" cy="40" r="20" fill="#e8edff"/><text x="38" y="45" text-anchor="middle" class="pill" fill="#5b5ce2">2</text>
    <text x="70" y="38" class="boxTitle">Personal computer</text><text x="70" y="61" class="boxText">Selected per chat or mission</text>
    <rect x="24" y="84" width="282" height="50" rx="12" fill="#eef1ff"/>
    <text x="40" y="106" class="pill" fill="#4b56c0">Aivin listener</text><text x="40" y="124" class="small">outbound connection · no open port</text>
    <rect x="24" y="146" width="134" height="38" rx="10" fill="#fff3e8"/><text x="91" y="170" text-anchor="middle" class="pill" fill="#b85c00">Mascot UI</text>
    <rect x="172" y="146" width="134" height="38" rx="10" fill="#edf7ff"/><text x="239" y="170" text-anchor="middle" class="pill" fill="#1668b2">Tools &amp; apps</text>
    <rect x="24" y="198" width="282" height="28" rx="14" fill="#f2f4f8"/><text x="165" y="217" text-anchor="middle" class="small">ask · voice · status · notifications</text>
  </g>

  <g transform="translate(816 374)" filter="url(#shadow)">
    <rect width="330" height="250" rx="22" fill="url(#device)" stroke="#dce6f7"/>
    <circle cx="38" cy="40" r="20" fill="#e8edff"/><text x="38" y="45" text-anchor="middle" class="pill" fill="#5b5ce2">N</text>
    <text x="70" y="38" class="boxTitle">Organization computer</text><text x="70" y="61" class="boxText">Isolated users and limits</text>
    <rect x="24" y="84" width="282" height="50" rx="12" fill="#eef1ff"/>
    <text x="40" y="106" class="pill" fill="#4b56c0">Aivin listener</text><text x="40" y="124" class="small">member scope · quotas · audit trail</text>
    <rect x="24" y="146" width="134" height="38" rx="10" fill="#e8fff6"/><text x="91" y="170" text-anchor="middle" class="pill" fill="#00875a">Local policy</text>
    <rect x="172" y="146" width="134" height="38" rx="10" fill="#edf7ff"/><text x="239" y="170" text-anchor="middle" class="pill" fill="#1668b2">Tools &amp; apps</text>
    <rect x="24" y="198" width="282" height="28" rx="14" fill="#f2f4f8"/><text x="165" y="217" text-anchor="middle" class="small">separate files · processes · memory</text>
  </g>

  <path d="M236 640C300 680 392 682 465 643" fill="none" stroke="#00a870" stroke-width="3" marker-end="url(#arrowGreen)"/>
  <path d="M964 640C900 680 808 682 735 643" fill="none" stroke="#00a870" stroke-width="3" marker-end="url(#arrowGreen)"/>
  <path d="M600 640V676" fill="none" stroke="#00a870" stroke-width="3"/>
  <rect x="435" y="660" width="330" height="34" rx="17" fill="#e6fff5" stroke="#b6efd9"/>
  <text x="600" y="682" text-anchor="middle" class="pill" fill="#00875a">↑ progress · questions · approvals · results</text>

  <circle cx="70" cy="676" r="14" fill="#5b6ee1"/><text x="70" y="681" text-anchor="middle" class="step">1</text>
  <text x="92" y="681" class="small">Choose a computer</text>
  <circle cx="224" cy="676" r="14" fill="#5b6ee1"/><text x="224" y="681" text-anchor="middle" class="step">2</text>
  <text x="246" y="681" class="small">Send scoped work</text>
  <circle cx="990" cy="676" r="14" fill="#00a870"/><text x="990" y="681" text-anchor="middle" class="step">3</text>
  <text x="1012" y="681" class="small">Return the result</text>
</svg>
