# get.aivin.vn - download site for the aivin CLI (installers + single-file builds), behind Cloudflare Tunnel.
#
#   /install.ps1, /install.sh       installers (short cache - always the newest installer)
#   /latest.txt                     current version, e.g. v1.1.0 (never cached - installers read it first)
#   /<version>/<asset>.gz           builds + SHA256SUMS of that version (immutable - cached by Cloudflare forever)
#
# Layout is produced by `npm run get:publish` (scripts/publish-get.mjs). Never edit a published version folder:
# publish a new version instead, so caches can never mix an old binary with a new checksum list.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    server_tokens off;
    # Builds are already gzip files; never let nginx re-compress or decompress anything here.
    gzip off;

    add_header X-Content-Type-Options nosniff always;

    # 404 must never be cached (Cloudflare adds its own browser TTL otherwise, 4 h seen on 26/10/2026): a version asked
    # for before it was published would keep failing after it is.
    error_page 404 /404.txt;
    location = /404.txt {
        internal;
        default_type text/plain;
        add_header Cache-Control "no-store" always;
        return 404 "Not found\n";
    }

    location = /latest.txt {
        default_type text/plain;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options nosniff always;
    }

    location ~ ^/install\.(ps1|sh)$ {
        default_type text/plain;
        types { }
        add_header Cache-Control "public, max-age=60" always;
        add_header X-Content-Type-Options nosniff always;
    }

    # Long cache only on success (no `always`): a 404 for a version asked for before it was published must not be cached for a year.
    location ~ ^/v[0-9]+\.[0-9]+\.[0-9]+[^/]*/ {
        # Binary downloads: octet-stream and no Content-Encoding, so clients keep the .gz bytes the checksum covers.
        types { }
        default_type application/octet-stream;
        location ~ /(SHA256SUMS|install\.(ps1|sh))$ { types { } default_type text/plain; add_header Cache-Control "public, max-age=31536000, immutable"; }
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff always;
    }

    location = / {
        add_header Cache-Control "public, max-age=60" always;
    }

    location / {
        try_files $uri =404;
    }
}
